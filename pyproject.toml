[project]
name = "desk"
version = "0.1.0"
description = "A visuo-spatial sketchpad for agent-produced figures"
requires-python = ">=3.11"
dependencies = [
    "markdown>=3.5",
]

[project.scripts]
desk = "desk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Never borrow the system or conda Python on a machine used for science —
# uv downloads and pins its own CPython for this project.
python-preference = "only-managed"
